devices:
  - device_sn: MTR-001
    device_type: meter
    name: 总进线电表
    protocol: modbus-tcp
    host: 192.168.1.10
    port: 502
    slave_id: 1
    location: 配电房
    sampling_interval: 5000
    enabled: true
    points:
      - name: voltage_a
        address: 0
        count: 2
        data_type: float32
        scale: 0.01
        unit: V
      - name: voltage_b
        address: 2
        count: 2
        data_type: float32
        scale: 0.01
        unit: V
      - name: voltage_c
        address: 4
        count: 2
        data_type: float32
        scale: 0.01
        unit: V
      - name: current_a
        address: 6
        count: 2
        data_type: float32
        scale: 0.001
        unit: A
      - name: current_b
        address: 8
        count: 2
        data_type: float32
        scale: 0.001
        unit: A
      - name: current_c
        address: 10
        count: 2
        data_type: float32
        scale: 0.001
        unit: A
      - name: active_power
        address: 12
        count: 2
        data_type: float32
        scale: 0.01
        unit: kW
      - name: reactive_power
        address: 14
        count: 2
        data_type: float32
        scale: 0.01
        unit: kVar
      - name: apparent_power
        address: 16
        count: 2
        data_type: float32
        scale: 0.01
        unit: kVA
      - name: power_factor
        address: 18
        count: 2
        data_type: float32
        scale: 0.001
        unit: ''
      - name: frequency
        address: 20
        count: 2
        data_type: float32
        scale: 0.01
        unit: Hz
      - name: total_active_energy
        address: 22
        count: 4
        data_type: float64
        scale: 0.01
        unit: kWh
      - name: total_reactive_energy
        address: 26
        count: 4
        data_type: float64
